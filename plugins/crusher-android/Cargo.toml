[package]
name = "crusher-android"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for Lag Crusher Android services"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
