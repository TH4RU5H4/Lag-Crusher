name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Normalize version
        id: normalize
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in semver format (e.g. 1.0.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  bump-version:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml and tauri.conf.json
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): v${{ needs.validate.outputs.version }}"
          git push origin HEAD
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

  build-android:
    needs: [validate, bump-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run tests
        run: bun run test
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release-key.jks
          ls -la $GITHUB_WORKSPACE/release-key.jks
          file $GITHUB_WORKSPACE/release-key.jks
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Init Android project
        run: cargo tauri android init
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build
      - name: Sign APK with apksigner
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          KEYSTORE_PATH="${{ github.workspace }}/release-key.jks"
          KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

          # Create build-tools path
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          # Zipalign first
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          ALIGNED_APK=$(echo "$UNSIGNED_APK" | sed 's/-unsigned/-aligned/')
          "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          echo "Aligned APK: $ALIGNED_APK"

          # Sign with apksigner
          SIGNED_APK=$(echo "$UNSIGNED_APK" | sed 's/-unsigned//')
          "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED_APK" "$ALIGNED_APK"
          echo "Signed APK: $SIGNED_APK"

          # Verify
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          ls -la "$SIGNED_APK"
      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          SIGNED_APK=$(find src-tauri/gen/android -name "*-release.apk" ! -name "*unsigned*" | head -1)
          cp "$SIGNED_APK" release-artifacts/LagCrusher.apk
          AAB=$(find src-tauri/gen/android -name "*.aab" | head -1)
          cp "$AAB" release-artifacts/LagCrusher.aab
          ls -la release-artifacts/
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-artifacts/

  publish:
    name: Publish GitHub release
    needs: [validate, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          artifacts: "release-assets/**/*"
          generateReleaseNotes: true
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
