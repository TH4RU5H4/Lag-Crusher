[package]
name = "lag-crusher"
version = "1.0.4"
description = "Lag Crusher"
authors = ["you"]
edition = "2021"

[lib]
name = "lag_crusher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
