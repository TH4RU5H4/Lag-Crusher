[package]
name = "lag-crusher"
version = "1.2.0"
description = "Lag Crusher"
authors = ["TH4RU5H4"]
edition = "2021"

[lib]
name = "lag_crusher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crusher-android = { path = "../plugins/crusher-android" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
